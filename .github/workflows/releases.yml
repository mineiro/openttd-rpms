name: Upstream releases
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openttd-release-publisher
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mineiro/openttd-rpms' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: fedora:44
    permissions:
      contents: write
    steps:
      - name: Install packaging tools
        run: dnf -y install --setopt=install_weak_deps=0 git make python3-pyyaml python3-rpm python3-copr rpm-build rpmlint
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Discover and verify official release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make update
          make check
          make srpm
          git diff --check
      - name: Keep the schedule active during quiet release periods
        run: |
          python3 - <<'PYTHON'
          from datetime import datetime, timezone, date
          from pathlib import Path
          marker = Path('.github/upstream-check.txt')
          today = datetime.now(timezone.utc).date()
          if not marker.exists() or (today - date.fromisoformat(marker.read_text().strip())).days >= 30:
              marker.write_text(today.isoformat() + '\n')
          PYTHON
      - name: Record verified version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/openttd/openttd.spec packages/openttd/release.json .github/upstream-check.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record verified OpenTTD release check: $(python3 -c 'import json; print(json.load(open("packages/openttd/release.json"))["upstream_version"])')"
            git push origin HEAD:main
          fi
      - name: Build missing COPR targets and wait for results
        id: copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          test -n "$COPR_CONFIG" || { echo '::error::Missing COPR_CONFIG secret'; exit 1; }
          umask 077
          mkdir -p "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          trap 'rm -f "$HOME/.config/copr"' EXIT
          python3 scripts/copr-build.py dist/srpm/openttd-*.src.rpm
      - name: Preserve source RPM
        if: failure() || steps.copr.outputs.submitted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-rpm
          path: dist/srpm/*.src.rpm
          if-no-files-found: ignore
          retention-days: 14
      - name: Run summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'OpenTTD release automation: **%s**\n\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf '[COPR builds](https://copr.fedorainfracloud.org/coprs/mineiro/openttd/builds/)\n' >> "$GITHUB_STEP_SUMMARY"
