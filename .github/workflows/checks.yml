name: Packaging checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install tools
        run: dnf -y install --setopt=install_weak_deps=0 git make python3-pyyaml python3-rpm rpm-build rpmlint mock
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Cache verified graphics source bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/openttd-opengfx2-classic/sources/*.tar.gz
            packages/openttd-opengfx2-classic/sources/*.tar.xz
          key: opengfx2-sources-${{ hashFiles('packages/openttd-opengfx2-classic/release.json', 'scripts/source_providers.py') }}
      - name: Check metadata and updater regressions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make check
          python3 scripts/check-nvr.py
          make srpm-all
      - name: Build the tool, data sets and game in clean Fedora 44
        shell: bash
        run: |
          set -euo pipefail
          srpms=()
          for package in $(make --no-print-directory list); do
            srpms+=("$(python3 scripts/releases.py srpm-path --package "$package")")
          done
          mock -r fedora-44-x86_64 --isolation=simple --chain --localrepo "$PWD/dist/chain" "${srpms[@]}"
          find dist/chain -name '*.rpm' -print0 | xargs -0 rpmlint -c rpmlint.toml
      - name: Verify a fresh install receives usable sound and music
        shell: bash
        run: |
          set -euo pipefail
          repo="file://$PWD/dist/chain/results/fedora-44-x86_64"
          mock -r fedora-44-x86_64 --uniqueext audio-install --isolation=simple --addrepo "$repo" --init
          mock -r fedora-44-x86_64 --uniqueext audio-install --isolation=simple --addrepo "$repo" --dnf-cmd install -y --setopt=install_weak_deps=True python3 openttd openttd-opengfx2-classic
          mock -r fedora-44-x86_64 --uniqueext audio-install --isolation=simple --copyin "$PWD/scripts/check-installed-assets.py" /tmp/
          mock -r fedora-44-x86_64 --uniqueext audio-install --isolation=simple --chroot 'python3 /tmp/check-installed-assets.py --graphics'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fedora-44-build
          path: |
            dist/srpm/*.src.rpm
            dist/chain/**/*.log
            dist/chain/**/*.rpm
          retention-days: 14
          compression-level: 0
