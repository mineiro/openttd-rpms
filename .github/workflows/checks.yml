name: Packaging checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install tools
        run: dnf -y install --setopt=install_weak_deps=0 git make python3-pyyaml python3-rpm rpm-build rpmlint mock
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check metadata and updater regressions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make check
          python3 scripts/check-nvr.py
          make srpm
      - name: Build and test in clean Fedora 44
        run: |
          mock -r fedora-44-x86_64 --isolation=simple --rebuild dist/srpm/openttd-*.src.rpm --resultdir "$PWD/dist/mock/fedora-44-x86_64"
          rpmlint dist/mock/fedora-44-x86_64/openttd-*.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fedora-44-build
          path: |
            dist/srpm/*.src.rpm
            dist/mock/fedora-44-x86_64/*.log
            dist/mock/fedora-44-x86_64/*.rpm
          retention-days: 14
